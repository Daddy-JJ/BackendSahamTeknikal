name: Manual read-only provider smoke
on:
  workflow_dispatch:
    inputs:
      target_date:
        description: Explicit historical end date, YYYY-MM-DD; no scan publication
        required: true
        default: '2026-10-01'
permissions:
  contents: read
jobs:
  provider-probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4, resolved 2026-10-02
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12.14'
      - run: python -m pip install ./scanner
      - name: Probe five explicitly verified Yahoo identities and actual adapter fetch
        env:
          PROBE_END: ${{ inputs.target_date }}
        run: python supabase/scripts/probe_live_provider.py --end "$PROBE_END"
      - name: Retain sanitized evidence only
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: provider-probe-evidence
          path: data/live-provider-20261002/evidence.json
          retention-days: 7
          if-no-files-found: warn
