name: Manual full-universe scanner smoke (no publication)
on:
  workflow_dispatch:
    inputs:
      target_date:
        description: Explicit closed exchange session; calendar and next-open guards apply
        required: true
        default: '2026-10-02'
permissions:
  contents: read
jobs:
  scanner-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.14'
      - run: python -m pip install uv==0.12.5
      - run: uv sync --locked --project scanner
      - name: Verify frozen public-source archive and original source hashes
        run: scanner/.venv/bin/python supabase/scripts/hydrate_reviewed_sources.py --archive config/reference/reviewed-action-source-archive-20261003.zip
      - name: Fetch verified KOMPAS100 and evaluate the canonical engine
        env:
          SCAN_TARGET: ${{ inputs.target_date }}
        run: scanner/.venv/bin/python supabase/scripts/manual_scanner_smoke.py --target "$SCAN_TARGET" --execute-fetch --require-usable
      - name: Retain sanitized evidence only
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: full-universe-scanner-smoke
          path: data/manual-scanner-smoke/latest-evidence.json
          retention-days: 7
          if-no-files-found: warn
