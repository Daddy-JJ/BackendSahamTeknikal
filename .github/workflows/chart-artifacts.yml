name: Optional Canonical Chart Artifacts

on:
  workflow_run:
    workflows: ['Scheduled Nightly Scanner & Paper Journal']
    branches: [main]
    types: [completed]
  workflow_dispatch:
    inputs:
      ticker:
        description: 'Optional verified ticker; empty builds the bounded owner universe'
        required: false
        default: ''
      max_tickers:
        description: 'Max tickers to build per run (1-100)'
        required: false
        default: '50'
      max_revisions:
        description: 'Max revisions per ticker (1-500)'
        required: false
        default: '500'

# This separate job never changes the status or transactions of the scanner job.
permissions:
  contents: read

concurrency:
  group: canonical-chart-artifacts
  cancel-in-progress: false

jobs:
  build-chart-artifacts:
    if: >-
      vars.CHART_ARTIFACTS_ENABLED == 'true' &&
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'workflow_dispatch' ||
       github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout trusted main
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: main
          persist-credentials: false
      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.14'
      - name: Install locked scanner dependencies
        run: |
          python -m pip install uv==0.12.5
          uv sync --locked --project scanner
      - name: Build chart artifacts from persisted canonical data
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL || vars.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          APP_OWNER_USER_ID: ${{ secrets.APP_OWNER_USER_ID || vars.APP_OWNER_USER_ID }}
          CHART_TICKER: ${{ inputs.ticker }}
          CHART_MAX_TICKERS: ${{ inputs.max_tickers || vars.CHART_MAX_TICKERS || '50' }}
          CHART_MAX_REVISIONS: ${{ inputs.max_revisions || vars.CHART_MAX_REVISIONS || '500' }}
        run: |
          args=(--execute --max-tickers "$CHART_MAX_TICKERS" --max-revisions "$CHART_MAX_REVISIONS")
          if [[ -n "$CHART_TICKER" ]]; then args+=(--ticker "$CHART_TICKER"); fi
          scanner/.venv/bin/python supabase/scripts/chart_artifact_runner.py "${args[@]}"
