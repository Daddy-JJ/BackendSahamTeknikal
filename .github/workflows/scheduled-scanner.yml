name: Scheduled Nightly Scanner & Paper Journal

on:
  schedule:
    # GitHub Actions cron menggunakan UTC.
    # WIB = UTC+7.
    #
    # Primary:
    # 11:18 UTC = 18:18 WIB
    #
    # Recovery:
    # 12:19 UTC = 19:19 WIB
    #
    # 1-5 = Monday-Friday
    - cron: '18 11 * * 1-5'  # 18:18 WIB (11:18 UTC) Primary
    - cron: '19 12 * * 1-5'  # 19:19 WIB (12:19 UTC) Recovery
    # Bounded extra slots; verified calendar chooses the latest closed session.
    # Weekend/holiday execution may recover Friday without assuming a new session.
    - cron: '23 15 * * *'    # 22:23 WIB late recovery
    - cron: '31 23 * * *'    # 06:31 WIB before the next exchange open

  workflow_dispatch:
    inputs:
      target_date:
        description: 'Explicit closed exchange session YYYY-MM-DD (empty = latest verified closed session)'
        required: false
        default: ''

      execute_publication:
        description: 'Publish results to live Supabase database'
        type: boolean
        default: true

      paper_only:
        description: 'Recover stored paper/signals only; never publish new signals'
        type: boolean
        default: false

permissions:
  contents: read
  actions: read

concurrency:
  group: nightly-scan
  cancel-in-progress: false

jobs:
  scan-and-simulate:
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.14'

      - name: Install dependencies
        run: |
          python -m pip install uv==0.12.5
          uv sync --locked --project scanner

      - name: Hydrate verified corporate action proofs
        run: |
          scanner/.venv/bin/python \
            supabase/scripts/hydrate_reviewed_sources.py \
            --archive config/reference/reviewed-action-source-archive-20261003.zip

      - name: Run scheduled scanner & paper journal simulation
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL || vars.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          APP_OWNER_USER_ID: ${{ secrets.APP_OWNER_USER_ID || vars.APP_OWNER_USER_ID }}
          TARGET_ARG: ${{ inputs.target_date }}
          EXECUTE_FLAG: ${{ (github.event_name == 'schedule' || inputs.execute_publication) && '--execute' || '' }}
          PAPER_ONLY: ${{ inputs.paper_only }}
          SCANNER_SCHEDULE: ${{ github.event.schedule }}

        run: |
          ARGS=""

          if [ -n "$TARGET_ARG" ]; then
            ARGS="--target $TARGET_ARG"
          fi

          if [ -n "$EXECUTE_FLAG" ]; then
            ARGS="$ARGS $EXECUTE_FLAG"
          fi

          if [ "$PAPER_ONLY" = "true" ]; then
            ARGS="$ARGS --paper-only"
          fi

          scanner/.venv/bin/python \
            supabase/scripts/scheduled_scanner_runner.py \
            $ARGS

      - name: Retain scanner evidence & paper journal summary
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: scheduled-scanner-artifacts
          path: |
            data/scheduled-scanner/
            data/paper-journal/
          retention-days: 14
          if-no-files-found: warn
