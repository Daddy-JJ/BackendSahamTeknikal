name: Manual scanner publication (approval required; no scheduler)
on:
  workflow_dispatch:
    inputs:
      target_date:
        description: Explicit closed exchange session, before its next open
        required: true
        default: '2026-10-02'
      execute_publication:
        description: Request the protected-environment approval job after reviewing the plan
        type: boolean
        default: false
permissions:
  contents: read
  actions: read
concurrency:
  group: manual-production-scanner-publication
  cancel-in-progress: false
jobs:
  prepare:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    outputs:
      plan_sha256: ${{ steps.plan.outputs.sha256 }}
      capture_directory: ${{ steps.plan.outputs.capture }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.14'
      - run: python -m pip install uv==0.12.5
      - run: uv sync --locked --project scanner
      - run: scanner/.venv/bin/python supabase/scripts/hydrate_reviewed_sources.py --archive config/reference/reviewed-action-source-archive-20261003.zip
      - name: Capture fresh public Yahoo data without database credentials
        env:
          SCAN_TARGET: ${{ inputs.target_date }}
        run: scanner/.venv/bin/python supabase/scripts/manual_scanner_smoke.py --target "$SCAN_TARGET" --execute-fetch --require-usable
      - name: Prepare checksum-bound zero-signal plan
        id: plan
        env:
          SCAN_TARGET: ${{ inputs.target_date }}
        run: |
          CAPTURE=$(python -c 'import json; print(json.load(open("data/manual-scanner-smoke/latest-evidence.json"))["capture_directory"])')
          scanner/.venv/bin/python supabase/scripts/prepare_manual_publication.py --capture "$CAPTURE" --target "$SCAN_TARGET" --plan data/manual-publication/approved-plan.json
          python - <<'PY'
          import json, os
          report = json.load(open('data/manual-publication/latest-evidence.json'))
          capture = json.load(open('data/manual-scanner-smoke/latest-evidence.json'))['capture_directory']
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write('sha256=' + report['plan_sha256'] + '\n')
              output.write('capture=' + capture + '\n')
          PY
      - name: Retain public OHLCV inputs and reviewable plan (no secrets)
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: manual-publication-plan
          path: |
            data/manual-scanner-smoke/
            data/manual-publication/
          retention-days: 1
          if-no-files-found: error
  publish:
    if: ${{ inputs.execute_publication }}
    needs: prepare
    environment: production-publisher
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read
      deployments: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.14'
      - run: python -m pip install uv==0.12.5
      - run: uv sync --locked --project scanner
      - name: Fail closed unless remote environment approval and main-only policies exist
        env:
          GH_TOKEN: ${{ github.token }}
        run: scanner/.venv/bin/python supabase/scripts/verify_publisher_environment.py
      - run: scanner/.venv/bin/python supabase/scripts/hydrate_reviewed_sources.py --archive config/reference/reviewed-action-source-archive-20261003.zip
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: manual-publication-plan
          path: data
      - name: Publish only the reviewed plan to the allowlisted live project
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL || vars.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          APPROVED_PLAN_SHA256: ${{ needs.prepare.outputs.plan_sha256 }}
          APPROVED_CAPTURE: ${{ needs.prepare.outputs.capture_directory }}
          SCAN_TARGET: ${{ inputs.target_date }}
        run: scanner/.venv/bin/python supabase/scripts/prepare_manual_publication.py --capture "$APPROVED_CAPTURE" --target "$SCAN_TARGET" --plan data/manual-publication/approved-plan.json --execute --project-ref hcjfxbynqzsaidlwvdfx --approved-plan-sha256 "$APPROVED_PLAN_SHA256"
      - name: Retain sanitized publication receipt or failure
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: manual-publication-result
          path: data/manual-publication/latest-evidence.json
          retention-days: 7
          if-no-files-found: warn
