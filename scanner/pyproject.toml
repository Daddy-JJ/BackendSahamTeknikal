[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/idx_scanner"]

[project]
name = "idx-night-scanner"
version = "0.1.0"
description = "Deterministic, provider-isolated IDX EOD research engine"
requires-python = ">=3.12,<3.13"
dependencies = [
    "httpx==0.28.1",
    "yfinance==1.7.0",
]

[project.scripts]
idx-scanner = "idx_scanner.cli:main"

[dependency-groups]
dev = [
    "jsonschema==4.26.0",
    "pytest==9.1.1",
    "ruff==0.16.9",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
